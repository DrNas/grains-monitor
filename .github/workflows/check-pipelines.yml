name: Check pipelines (no publish)

# Runs the desk pipelines with the repository's secrets on a work branch and keeps their output as a
# downloadable artifact, so a new or changed pipeline can be checked against real data before it goes
# live. Nothing is deployed. Other sources are copied from the published snapshot.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Sources to run (comma separated ids from scripts/build-data.mjs)'
        default: 'crop_progress,wasde,export_sales,energy'
  push:
    branches-ignore: [main]
    paths: ['pipelines/**', 'data/wasde/**', 'scripts/build-data.mjs', '.github/workflows/check-pipelines.yml']

permissions:
  contents: read

concurrency:
  group: check-pipelines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipelines/requirements.txt
      - run: pip install -r pipelines/requirements.txt
      - name: Run the pipelines
        id: build
        env:
          ONLY: ${{ inputs.only || 'crop_progress,wasde,export_sales,energy' }}
          MMN_API_KEY: ${{ secrets.MMN_API_KEY }}
          NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
          DATAGOV_API_KEY: ${{ secrets.DATAGOV_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/build-data.mjs
      - name: Summarize the output
        run: |
          for f in _site/data/*.json; do
            [ "$(basename $f)" = latest.json ] && continue
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(sys.argv[1], d.get('state'), d.get('latest'), (d.get('note') or '')[:200], len(json.dumps(d.get('data'))), 'bytes of data')" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: _site/data/
          retention-days: 7
      - name: Fail if a source failed
        if: steps.build.outputs.failed != ''
        run: |
          echo "::error::Failed: ${{ steps.build.outputs.failed }}"
          exit 1
